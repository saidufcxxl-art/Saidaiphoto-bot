services:
  - type: web
    name: photo-bot
    env: python

    buildCommand: pip install -r requirements.txt

    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: PORT
        value: "10000"

    plan: free
